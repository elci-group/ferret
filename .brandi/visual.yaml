palette:
  primary: "#C47E5A"
  secondary: ["#F5E6D3", "#E8A87C", "#8B5A3C", "#FF6B8A", "#58D5FF", "#7EBA5A", "#FFB020", "#E8505A"]
  neutrals: ["#FDF8F3", "#1A1512", "#7A6B63"]
  semantic:
    success: "#7EBA5A"
    warning: "#FFB020"
    error: "#E8505A"
    info: "#58D5FF"
  color_tolerance: 24
typography:
  style: technical_modern
  preferred_fonts: ["JetBrains Mono", "Inter", "Fira Code", "system-ui", "ui-monospace"]
assets:
  social_card: { width: 1200, height: 630 }
  thumbnail: { width: 1280, height: 720 }
  logo_mark: { width: 512, height: 512 }
  min_whitespace: 0.25
  max_file_kb: 500
  coherence_min_palette: 50
animation:
  cli_spinner: "ferret_dash"
  progress_style: "rounded_bar"
  output_transitions: true
  vhs_framerate: 60
  vhs_typing_speed: 50ms
